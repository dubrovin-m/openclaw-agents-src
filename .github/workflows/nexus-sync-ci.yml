name: Nexus sync CI

on:
  push:
    branches: [main]
    paths:
      - "shared/nexus-sync/**"
      - ".github/workflows/nexus-sync-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nexus sync gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Nexus sync relevance
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            relevant=false
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(shared/nexus-sync/|\.github/workflows/nexus-sync-ci\.yml$)'; then
              relevant=true
            fi
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
          printf 'nexus_sync_relevant=%s event=%s head=%s\n' "$relevant" "$GITHUB_EVENT_NAME" "$(git rev-parse HEAD)"

      - name: Validate source package
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          bash -n shared/nexus-sync/install.sh
          bash -n shared/nexus-sync/validate.sh
          bash -n shared/nexus-sync/test-runtime-validation.sh
          bash shared/nexus-sync/validate.sh --source
          bash shared/nexus-sync/test-runtime-validation.sh
          git diff --exit-code
          git diff --cached --exit-code
