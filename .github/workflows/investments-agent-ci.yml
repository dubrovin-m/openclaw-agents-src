name: Investments Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Investments Agent gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Investments relevance
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            relevant=false
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if grep -Eq '^(runtime-contract\.json$|openclaw-qualification\.json$|shared/runtime-contract/|agents/investments/|\.github/workflows/investments-agent-ci\.yml$)' <<<"$changed_files"; then relevant=true; fi
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"

      - name: Read runtime requirements and qualification target
        if: steps.scope.outputs.relevant == 'true'
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          contract=json.load(open('runtime-contract.json', encoding='utf-8'))
          qualification=json.load(open('openclaw-qualification.json', encoding='utf-8'))
          node_version=str(contract.get('node',{}).get('ci_version',''))
          openclaw_version=str(qualification.get('version',''))
          vr=r'[0-9]+\.[0-9]+\.[0-9]+'
          if not re.fullmatch(vr,node_version): raise SystemExit('invalid node.ci_version')
          if qualification.get('format')!='openclaw-qualification-target-v1' or not re.fullmatch(vr,openclaw_version): raise SystemExit('invalid OpenClaw qualification target')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'node_version={node_version}\nopenclaw_version={openclaw_version}\n')
          PY

      - name: Set up Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.runtime.outputs.node_version }}

      - name: Validate repository runtime requirements
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          node shared/runtime-contract/runtime-contract.mjs validate runtime-contract.json
          node shared/runtime-contract/runtime-contract.mjs openclaw-version openclaw-qualification.json
          node shared/runtime-contract/runtime-contract.mjs repo-check .
          node --test shared/runtime-contract/runtime-contract.test.mjs

      - name: Install Investments plugin dependencies
        if: steps.scope.outputs.relevant == 'true'
        working-directory: agents/investments/plugin
        run: npm ci

      - name: Validate Investments source, tests and plugin
        if: steps.scope.outputs.relevant == 'true'
        working-directory: agents/investments/plugin
        run: |
          set -euo pipefail
          npm test
          npm run plugin:build
          npm run plugin:validate
          cd ..
          bash validate.sh

      - name: Validate Investments against qualified OpenClaw host
        if: steps.scope.outputs.relevant == 'true'
        working-directory: agents/investments/plugin
        env:
          OPENCLAW_QUALIFICATION_VERSION: ${{ steps.runtime.outputs.openclaw_version }}
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/openclaw-investments-qualification"
          npm install --prefix "$qualification_root" --no-save --package-lock=false "openclaw@$OPENCLAW_QUALIFICATION_VERSION" >/dev/null
          "$qualification_root/node_modules/.bin/openclaw" plugins validate --root . --entry ./dist/plugin.js

      - name: Verify generated Investments metadata is frozen
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            agents/investments/plugin/package.json \
            agents/investments/plugin/package-lock.json \
            agents/investments/plugin/openclaw.plugin.json \
            agents/investments/plugin/dist
