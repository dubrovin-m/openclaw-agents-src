name: Voice Transcription CI

on:
  push:
    branches: [main]
    paths:
      - "shared/voice-transcription/**"
      - "runtime-contract.json"
      - "openclaw-qualification.json"
      - "shared/runtime-contract/**"
      - ".github/workflows/voice-transcription-ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-transcription-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Voice Transcription gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Voice Transcription relevance
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            relevant=false
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if grep -Eq '^(shared/voice-transcription/|runtime-contract\.json$|openclaw-qualification\.json$|shared/runtime-contract/|\.github/workflows/voice-transcription-ci\.yml$)' <<<"$changed_files"; then
              relevant=true
            fi
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
          printf 'voice_relevant=%s event=%s head=%s\n' "$relevant" "$GITHUB_EVENT_NAME" "$(git rev-parse HEAD)"

      - name: Validate steady-state voice source
        if: steps.scope.outputs.relevant == 'true'
        run: bash shared/voice-transcription/validate.sh

      - name: Verify source remains unchanged
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          git diff --exit-code -- shared/voice-transcription
          git status --short

  authorized_materialization:
    if: github.event_name == 'pull_request' && github.head_ref == 'qualify/openclaw-2026-9-8' && github.repository == 'dubrovin-m/openclaw-agents-src'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Prepare outputs from approved source
        shell: bash
        run: |
          set -euo pipefail
          BASE="a5051d43672d64612a7f8f0eab00037a8bb968bc"
          BRANCH="qualify/openclaw-2026-9-8"
          ONE_TIME=".github/workflows/voice-transcription-ci.yml"
          test "$GITHUB_HEAD_REF" = "$BRANCH"
          test "$GITHUB_REPOSITORY" = "dubrovin-m/openclaw-agents-src"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$BASE" HEAD)" = "$ONE_TIME"
          test "$(node shared/runtime-contract/runtime-contract.mjs openclaw-version openclaw-qualification.json)" = "2026.9.8"
          python3 - <<'PY_STAGE'
          
          import json, pathlib, subprocess, hashlib
          ROOT=pathlib.Path.cwd()
          BASE='9a540f0efa9510626d5721f868699aabebb9322c'
          NEW='2026.9.8'
          RANGE='>=2026.9.5 <=2026.9.8'
          def load(p):return json.loads((ROOT/p).read_text())
          def write(p,x):(ROOT/p).write_text(json.dumps(x,indent=2)+'\n')
          def show(p):return subprocess.check_output(['git','show',f'{BASE}:{p}'])
          def sha(b):return hashlib.sha256(b).hexdigest()
          for path,ver,old in [('agents/tasks/plugins/taskctl','0.4.32','0.4.31'),('shared/contacts/plugin','0.1.8','0.1.7'),('agents/training/plugin','0.1.3','0.1.2')]:
              pkg=load(f'{path}/package.json')
              assert pkg['version']==old and pkg['devDependencies']['openclaw']=='2026.9.7'
              assert pkg['peerDependencies']['openclaw']=='>=2026.9.5 <=2026.9.7', 'Invalid old compatibility range'
              pkg['version']=ver
              pkg['devDependencies']['openclaw']=NEW
              pkg['peerDependencies']['openclaw']=RANGE
              pkg['openclaw']['compat']['pluginApi']=RANGE
              pkg['openclaw']['build']['openclawVersion']=NEW
              write(f'{path}/package.json',pkg)
              manifest=load(f'{path}/openclaw.plugin.json')
              assert manifest['version']==old
              manifest['version']=ver
              write(f'{path}/openclaw.plugin.json',manifest)
          c=load('shared/contacts/release.json')
          assert c['plugin']['version']=='0.1.7' and c['openclaw_build_version']=='2026.9.7'
          prev=json.loads(show('shared/contacts/release.json'))
          c['from']={'source_revision':BASE,'implementation_version':prev['implementation_version'],'sqlite_schema':prev['sqlite_schema'],'plugin_version':prev['plugin']['version'],'release_sha256':sha(show('shared/contacts/release.json'))}
          c['plugin'].update(version='0.1.8',artifact='artifacts/openclaw-plugin-contacts-0.1.8.tgz')
          c['openclaw_build_version']=NEW;c['openclaw_compat']=RANGE
          write('shared/contacts/release.json',c)
          t=load('agents/tasks/release.json');old=json.loads(show('agents/tasks/release.json'))
          assert t['plugin']['version']=='0.4.31' and t['generation']['openclaw_build_version']=='2026.9.7'
          files=['AGENTS.md','SOUL.md','USER.md','IDENTITY.md','HEARTBEAT.md']
          def stable(x):
              if isinstance(x,dict):return '{'+','.join(json.dumps(k,separators=(',',':'))+':'+stable(x[k]) for k in sorted(x))+'}'
              if isinstance(x,list):return '['+','.join(stable(a) for a in x)+']'
              return json.dumps(x,separators=(',',':'),ensure_ascii=False)
          t['from']={'source_revision':BASE,'sqlite_schemas':[old['generation']['sqlite_schema']],'taskctl_versions':[old['generation']['taskctl_version']],'plugin_versions':[old['plugin']['version']],'workspace_sha256':{f:sha(show('agents/tasks/workspace/'+f)) for f in files},'tools_sha256':sha(stable(json.loads(show('agents/tasks/config/tasks-tools.json'))).encode())}
          t['generation']['openclaw_build_version']=NEW;t['generation']['openclaw_compat']=RANGE
          t['plugin'].update(version='0.4.32',artifact='artifacts/openclaw-plugin-taskctl-0.4.32.tgz')
          write('agents/tasks/release.json',t)
          tr=load('agents/training/release.json')
          assert tr['plugin']['version']=='0.1.2' and tr['generation']['openclaw_build_version']=='2026.9.7'
          oldPlugin=tr['plugin'].copy()
          tr['predecessor']={'source_revision':BASE,'plugin':oldPlugin,'workspace_sha256':tr['source']['workspace_sha256'].copy(),'plugin_manifest_sha256':tr['source']['plugin_manifest_sha256']}
          tr['plugin'].update(version='0.1.3',artifact='artifacts/openclaw-plugin-training-0.1.3.tgz')
          tr['generation']['openclaw_build_version']=NEW;tr['generation']['openclaw_compat']=RANGE
          tr['source']['plugin_manifest_sha256']=sha((ROOT/'agents/training/plugin/openclaw.plugin.json').read_bytes())
          write('agents/training/release.json',tr)
          print('RELEASE_METADATA_STAGED')
          PY_STAGE
          for p in shared/contacts/plugin agents/tasks/plugins/taskctl agents/training/plugin; do
            (cd "$p" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            (cd "$p" && npm ci --no-audit --no-fund)
            (cd "$p" && npm run plugin:build)
            (cd "$p" && npm run plugin:validate)
          done
          for spec in "shared/contacts/plugin shared/contacts/artifacts" "agents/tasks/plugins/taskctl agents/tasks/artifacts" "agents/training/plugin agents/training/artifacts"; do
            read -r source target <<<"$spec"
            mkdir -p "$target"
            npm pack "./$source" --pack-destination "$target" >/dev/null
          done
          python3 - <<'PY_FINISH'
          
          import json, pathlib, subprocess,hashlib
          R=pathlib.Path.cwd()
          def load(p):return json.loads((R/p).read_text())
          def write(p,o):(R/p).write_text(json.dumps(o,indent=2)+'\n')
          def sha(b):return hashlib.sha256(b).hexdigest()
          def digest(p):return sha((R/p).read_bytes())
          for root,ver,old in [('shared/contacts','0.1.8','0.1.7'),('agents/tasks','0.4.32','0.4.31'),('agents/training','0.1.3','0.1.2')]:
              p=f'{root}/release.json';r=load(p)
              name=r['plugin']['name']
              artifact=pathlib.Path(root)/'artifacts'/f'{name}-{ver}.tgz'
              assert artifact.is_file(),f'missing {artifact}'
              d=digest(artifact)
              r['plugin']['sha256']=d
              side=artifact.with_suffix('.sha256')
              side.write_text(f'{d}  {artifact.name}\n')
              if root=='agents/training':
                  runtime=subprocess.check_output(['tar','-xOf',str(artifact),'package/dist/plugin.js'])
                  r['plugin']['runtime_entry_sha256']=sha(runtime)
              write(p,r)
              old_art=R/root/'artifacts'/f'{name}-{old}.tgz'
              if root!='agents/training':
                  old_side=old_art.with_suffix('.sha256')
                  assert old_art.is_file() and old_side.is_file()
                  old_art.unlink();old_side.unlink()
              print('PACKED',name,ver,d)
          # Training predecessor is the previously installed 0.1.2 artifact;
          # retire its older 0.1.1 predecessor while retaining 0.1.2.
          for suffix in ['tgz','sha256']:
              older=R/'agents/training/artifacts'/f'openclaw-plugin-training-0.1.1.{suffix}'
              if older.exists():older.unlink()
          contacts=load('shared/contacts/release.json')
          task=load('agents/tasks/release.json')
          task['shared_contacts']['release_sha256']=digest('shared/contacts/release.json')
          task['shared_contacts']['implementation_version']=contacts['implementation_version']
          task['shared_contacts']['sqlite_schema']=contacts['sqlite_schema']
          write('agents/tasks/release.json',task)
          PY_FINISH
          git add -A -- agents/tasks/plugins/taskctl agents/tasks/artifacts agents/tasks/release.json shared/contacts/plugin shared/contacts/artifacts shared/contacts/release.json agents/training/plugin agents/training/artifacts agents/training/release.json
          python3 - <<'PY_ALLOWED'
          
          import subprocess,sys
          files=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          files=[p for p in files if p]
          def ok(p):
              for prefix in ['agents/tasks/plugins/taskctl/dist/','shared/contacts/plugin/dist/','agents/training/plugin/dist/','agents/tasks/artifacts/','shared/contacts/artifacts/','agents/training/artifacts/']:
                  if p.startswith(prefix):return True
              if p in {
                 'agents/tasks/plugins/taskctl/package.json','agents/tasks/plugins/taskctl/package-lock.json','agents/tasks/plugins/taskctl/openclaw.plugin.json',
                 'shared/contacts/plugin/package.json','shared/contacts/plugin/package-lock.json','shared/contacts/plugin/openclaw.plugin.json',
                 'agents/training/plugin/package.json','agents/training/plugin/package-lock.json','agents/training/plugin/openclaw.plugin.json',
                 'agents/tasks/release.json','shared/contacts/release.json','agents/training/release.json',
              }:return True
              return False
          bad=[p for p in files if not ok(p)]
          if not files or bad:
              print('REFUSING_OUTPUTS',len(files),bad,file=sys.stderr);sys.exit(2)
          print('ALLOWED_ARTIFACT_FILES',len(files))
          PY_ALLOWED
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/materialized/changes"
          git diff --cached --name-only -z > "$RUNNER_TEMP/materialized/path-list.z"
          python3 - <<'PY_OUTPUT'
          import pathlib,shutil,subprocess,json,hashlib
          d=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'materialized'
          paths=[s.decode() for s in (d/'path-list.z').read_bytes().split(b'\0') if s]
          entries=[]
          for name in paths:
              path=pathlib.Path(name)
              if path.is_file():
                  dst=d/'changes'/path
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,dst)
                  entries.append({'path':name,'operation':'upsert','size':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
              else:
                  entries.append({'path':name,'operation':'delete'})
          (d/'manifest.json').write_text(json.dumps({'format':'openclaw-2026.9.8-prep-v1','source_sha':'a5051d43672d64612a7f8f0eab00037a8bb968bc','files':entries},indent=2)+'\n')
          print('MATERIALIZED_FILES',len(entries))
          PY_OUTPUT
          tar -czf "$RUNNER_TEMP/qualify-2026.9.8-materialized.tgz" -C "$RUNNER_TEMP/materialized" changes manifest.json
          sha256sum "$RUNNER_TEMP/qualify-2026.9.8-materialized.tgz"
          echo "MATERIALIZATION_BUILD_COMPLETE; NO REPOSITORY WRITE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-2026-9-8-materialized-exact-source
          path: ${{ runner.temp }}/qualify-2026.9.8-materialized.tgz
          if-no-files-found: error
          retention-days: 2
