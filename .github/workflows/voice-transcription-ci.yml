name: Voice Transcription CI

on:
  push:
    paths:
      - "shared/voice-transcription/**"
      - ".github/workflows/voice-transcription-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared/voice-transcription/**"
      - ".github/workflows/voice-transcription-ci.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-transcription-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate steady-state voice source
        run: bash shared/voice-transcription/validate.sh

      - name: Verify source remains unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- shared/voice-transcription
          git status --short
