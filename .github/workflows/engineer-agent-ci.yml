name: Engineer Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "runtime-contract.json"
      - "shared/runtime-contract/**"
      - "agents/engineer/**"
      - ".github/workflows/engineer-agent-ci.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Engineer relevance
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          relevant=true
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            relevant=false
            if [[ ! "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              relevant=true
            elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(runtime-contract\.json$|shared/runtime-contract/|agents/engineer/|\.github/workflows/engineer-agent-ci\.yml$)'; then
              relevant=true
            fi
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"

      - name: Read runtime contract
        if: steps.scope.outputs.relevant == 'true'
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          with open('runtime-contract.json', encoding='utf-8') as handle:
              contract = json.load(handle)
          version = str(contract.get('node', {}).get('ci_version', ''))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('invalid node.ci_version in runtime-contract.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'node_version={version}\n')
          PY

      - name: Set up Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.runtime.outputs.node_version }}

      - name: Validate repository runtime contract
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          node --check shared/runtime-contract/runtime-contract.mjs
          node shared/runtime-contract/runtime-contract.mjs repo-check .
          node --test shared/runtime-contract/runtime-contract.test.mjs

      - name: Validate Engineer source package
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n agents/engineer/validate.sh
          bash agents/engineer/validate.sh
