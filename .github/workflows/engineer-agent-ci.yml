name: Engineer Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Engineer Agent gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Engineer relevance
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            relevant=false
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if grep -Eq '^(runtime-contract\.json$|openclaw-qualification\.json$|shared/runtime-contract/|agents/engineer/|\.github/workflows/engineer-agent-ci\.yml$)' <<<"$changed_files"; then
              relevant=true
            fi
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
          printf 'engineer_relevant=%s event=%s head=%s\n' "$relevant" "$GITHUB_EVENT_NAME" "$(git rev-parse HEAD)"

      - name: Read runtime contract
        if: steps.scope.outputs.relevant == 'true'
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          with open('runtime-contract.json', encoding='utf-8') as handle:
              contract = json.load(handle)
          with open('openclaw-qualification.json', encoding='utf-8') as handle:
              qualification = json.load(handle)
          node_version = str(contract.get('node', {}).get('ci_version', ''))
          openclaw_version = str(qualification.get('version', ''))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', node_version):
              raise SystemExit('invalid node.ci_version in runtime-contract.json')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', openclaw_version):
              raise SystemExit('invalid version in openclaw-qualification.json')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'node_version={node_version}\n')
              output.write(f'openclaw_version={openclaw_version}\n')
          PY

      - name: Set up Node.js
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.runtime.outputs.node_version }}

      - name: Validate repository runtime contract
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          node --check shared/runtime-contract/runtime-contract.mjs
          node shared/runtime-contract/runtime-contract.mjs repo-check .
          node --test shared/runtime-contract/runtime-contract.test.mjs

      - name: Validate Engineer source package
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n agents/engineer/validate.sh
          bash agents/engineer/validate.sh

      - name: Validate Engineer config against qualified OpenClaw
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          OPENCLAW_QUALIFICATION_VERSION: ${{ steps.runtime.outputs.openclaw_version }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          npm install --prefix "$tmp" --no-package-lock --no-save "openclaw@$OPENCLAW_QUALIFICATION_VERSION" >/dev/null
          node - "$tmp/openclaw.json" <<'NODE'
          const fs = require('node:fs');
          const agent = JSON.parse(fs.readFileSync('agents/engineer/config/engineer-agent.fragment.json', 'utf8'));
          const tools = JSON.parse(fs.readFileSync('agents/engineer/config/engineer-tools.json', 'utf8'));
          const { id, ...entry } = agent;
          if (id !== 'engineer') throw new Error('unexpected Engineer agent id');
          entry.tools = tools;
          fs.writeFileSync(process.argv[2], JSON.stringify({ agents: { entries: { [id]: entry } } }));
          NODE
          OPENCLAW_CONFIG_PATH="$tmp/openclaw.json" "$tmp/node_modules/.bin/openclaw" config validate --json > "$tmp/validation.json"
          node - "$tmp/validation.json" <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result?.valid !== true || (Array.isArray(result?.warnings) && result.warnings.length !== 0)) process.exit(2);
          NODE
