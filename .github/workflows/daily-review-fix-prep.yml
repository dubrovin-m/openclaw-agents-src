name: Daily Review Fix Prep

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/tasks/plugins/taskctl/**"
      - ".github/workflows/daily-review-fix-prep.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'dubrovin-m'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Build and validate exact candidate
        working-directory: agents/tasks/plugins/taskctl
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run plugin:build
          npm run plugin:validate
          mkdir -p "$GITHUB_WORKSPACE/.candidate"
          npm pack --pack-destination "$GITHUB_WORKSPACE/.candidate" >/dev/null
          test -f "$GITHUB_WORKSPACE/.candidate/openclaw-plugin-taskctl-0.4.28.tgz"
      - name: Freeze release and remove preparation state
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/.candidate/openclaw-plugin-taskctl-0.4.28.tgz"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"
          test "$digest" = "1eebbc6ec88b6d7fb03c6f6190dc72e99fe1349d85b34f45f85e8044f449c15b"
          cp "$artifact" agents/tasks/artifacts/openclaw-plugin-taskctl-0.4.28.tgz
          printf '%s  %s\n' "$digest" "openclaw-plugin-taskctl-0.4.28.tgz" > agents/tasks/artifacts/openclaw-plugin-taskctl-0.4.28.sha256
          node - <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const base = process.env.BASE_SHA;
          const files = ['AGENTS.md','SOUL.md','USER.md','IDENTITY.md','HEARTBEAT.md'];
          const sha256 = (value) => createHash('sha256').update(value).digest('hex');
          const stableJson = (value) => value === null || typeof value !== 'object'
            ? JSON.stringify(value)
            : Array.isArray(value)
              ? `[${value.map(stableJson).join(',')}]`
              : `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJson(value[key])}`).join(',')}}`;
          const show = (file) => execFileSync('git', ['show', `${base}:${file}`], { encoding: 'utf8' });
          const predecessor = JSON.parse(show('agents/tasks/release.json'));
          const workspace_sha256 = Object.fromEntries(files.map((file) => [file, sha256(show(`agents/tasks/workspace/${file}`))]));
          const tools_sha256 = sha256(stableJson(JSON.parse(show('agents/tasks/config/tasks-tools.json'))));
          const releasePath = 'agents/tasks/release.json';
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          release.plugin = {
            name: 'openclaw-plugin-taskctl',
            version: '0.4.28',
            artifact: 'artifacts/openclaw-plugin-taskctl-0.4.28.tgz',
            sha256: '1eebbc6ec88b6d7fb03c6f6190dc72e99fe1349d85b34f45f85e8044f449c15b',
          };
          release.from = {
            source_revision: base,
            sqlite_schemas: [predecessor.generation.sqlite_schema],
            taskctl_versions: [predecessor.generation.taskctl_version],
            plugin_versions: [predecessor.plugin.version],
            workspace_sha256,
            tools_sha256,
          };
          fs.writeFileSync(releasePath, JSON.stringify(release, null, 2) + '\n');
          const lockPath = 'agents/tasks/plugins/taskctl/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = '0.4.28';
          lock.packages[''].version = '0.4.28';
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          NODE
          rm -f \
            agents/tasks/artifacts/openclaw-plugin-taskctl-0.4.27.tgz \
            agents/tasks/artifacts/openclaw-plugin-taskctl-0.4.27.sha256 \
            agents/tasks/artifacts/openclaw-plugin-taskctl-0.4.28.tgz.b64 \
            NOOP \
            .github/workflows/daily-review-fix-prep.yml
          git diff --check
      - name: Commit exact frozen release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Daily Review plugin 0.4.28 release"
          git push origin "HEAD:${HEAD_BRANCH}"
