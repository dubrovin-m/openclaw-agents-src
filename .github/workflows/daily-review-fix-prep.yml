name: Daily Review Fix Prep

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/tasks/plugins/taskctl/**"
      - ".github/workflows/daily-review-fix-prep.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Build, test, and emit frozen package candidate
        working-directory: agents/tasks/plugins/taskctl
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run plugin:build
          npm run plugin:validate
          out="$(mktemp -d)"
          npm pack --pack-destination "$out" >/dev/null
          artifact="$out/openclaw-plugin-taskctl-0.4.28.tgz"
          test -f "$artifact"
          printf 'TASK_PLUGIN_SHA256=%s\n' "$(sha256sum "$artifact" | awk '{print $1}')"
          printf '%s\n' 'TASK_PLUGIN_BASE64_BEGIN'
          base64 -w 120 "$artifact"
          printf '%s\n' 'TASK_PLUGIN_BASE64_END'
