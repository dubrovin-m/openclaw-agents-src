name: Daily Review Fix Prep

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/tasks/plugins/taskctl/**"
      - ".github/workflows/daily-review-fix-prep.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Build, test, and package candidate
        working-directory: agents/tasks/plugins/taskctl
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run plugin:build
          npm run plugin:validate
          mkdir -p "$GITHUB_WORKSPACE/.candidate"
          npm pack --pack-destination "$GITHUB_WORKSPACE/.candidate" >/dev/null
          artifact="$GITHUB_WORKSPACE/.candidate/openclaw-plugin-taskctl-0.4.28.tgz"
          test -f "$artifact"
          printf 'TASK_PLUGIN_SHA256=%s\n' "$(sha256sum "$artifact" | awk '{print $1}')"
      - name: Upload exact package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-plugin-0.4.28-candidate
          path: .candidate/openclaw-plugin-taskctl-0.4.28.tgz
          if-no-files-found: error
          retention-days: 1
