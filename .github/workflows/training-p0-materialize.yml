name: Training P0 approved release materialization

on:
  push:
    branches: [fix/training-p0-approval-load-guard]
    paths: [.github/workflows/training-p0-materialize.yml]

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'dubrovin-m/openclaw-agents-src' && github.actor == 'dubrovin-m'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_SOURCE: 3b48485840bab602bbf913c4380f096a3a05f534
      PREPARED_SOURCE: 7a2aadb07d7ec02541cf88f55fb84a98432f136c
      PREVIOUS_RELEASE: 31216d99dd23cb36a3ad353a30575604aea525b4
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Check out this exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-time authorization and unchanged source logic
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/training-p0-approval-load-guard'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$PREPARED_SOURCE" = "$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$APPROVED_SOURCE" "$PREPARED_SOURCE"
          git diff --quiet "$APPROVED_SOURCE" "$PREPARED_SOURCE" -- \
            agents/training/plugin/src agents/training/workspace \
            agents/training/config agents/training/ACCEPTANCE.md
          python3 - <<'PY'
          import os, subprocess, json
          base=os.environ['APPROVED_SOURCE']; prepared=os.environ['PREPARED_SOURCE']
          expected={'agents/training/plugin/package.json',
                    'agents/training/plugin/package-lock.json',
                    'agents/training/plugin/openclaw.plugin.json'}
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,prepared],text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Not exactly approved version-only metadata: {changed}')
          for rel in expected:
              before=json.loads(subprocess.check_output(['git','show',f'{base}:{rel}']))
              after=json.loads(subprocess.check_output(['git','show',f'{prepared}:{rel}']))
              if before.get('version') != '0.1.3' or after.get('version') != '0.1.4':
                  raise SystemExit('Invalid version transition: '+rel)
              if rel.endswith('package-lock.json'):
                  if before['packages'][''].get('version') != '0.1.3' or after['packages'][''].get('version') != '0.1.4':
                      raise SystemExit('Invalid lockfile root version')
                  before['packages']['']['version']='0.1.4'
              before['version']='0.1.4'
              if before != after:
                  raise SystemExit('Material change beyond version metadata: '+rel)
          PY

      - name: Set up qualified Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Qualify exact source before materialization
        working-directory: agents/training/plugin
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run plugin:build
          npm run plugin:validate

      - name: Materialize immutable Training 0.1.4 target
        shell: bash
        run: |
          set -euo pipefail
          cd agents/training/plugin
          output=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          test "$output" = 'openclaw-plugin-training-0.1.4.tgz'
          cp "$RUNNER_TEMP/$output" ../artifacts/"$output"
          cd ../../..
          python3 - <<'PY'
          import copy,hashlib,json,os,pathlib
          root=pathlib.Path('agents/training')
          f=root/'release.json'
          release=json.loads(f.read_text(encoding='utf-8'))
          prior=copy.deepcopy(release['plugin'])
          previous_source=copy.deepcopy(release['source'])
          if prior['version']!='0.1.3' or release['predecessor']['plugin']['version']!='0.1.2':
              raise SystemExit('Unexpected frozen Training predecessor')
          previous=copy.deepcopy(release)
          previous['plugin']=prior
          release['predecessor']={
              'source_revision':os.environ['PREVIOUS_RELEASE'],
              'plugin':prior,
              'workspace_sha256':previous_source['workspace_sha256'],
              'plugin_manifest_sha256':previous_source['plugin_manifest_sha256'],
          }
          def hash_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          artifact=root/'artifacts/openclaw-plugin-training-0.1.4.tgz'
          if not artifact.is_file() or (root/'artifacts/openclaw-plugin-training-0.1.4.tgz.sha256').exists():
              raise SystemExit('Materialization target already exists')
          digest=hash_file(artifact)
          (root/'artifacts/openclaw-plugin-training-0.1.4.sha256').write_text(
              f'{digest}  {artifact.name}\n',encoding='utf-8')
          release['plugin'].update({
              'version':'0.1.4',
              'artifact':'artifacts/'+artifact.name,
              'sha256':digest,
              'runtime_entry_sha256':hash_file(root/'plugin/dist/plugin.js'),
          })
          src=release['source']
          src['source_revision']=os.environ['PREPARED_SOURCE']
          src['workspace_sha256']={
              name:hash_file(root/'workspace'/name)
              for name in ['AGENTS.md','HEARTBEAT.md','IDENTITY.md','SOUL.md','USER.md']
          }
          src['tools_sha256']=hash_file(root/'config/training-tools.json')
          src['agent_fragment_sha256']=hash_file(root/'config/training-agent.fragment.json')
          src['plugin_manifest_sha256']=hash_file(root/'plugin/openclaw.plugin.json')
          f.write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          bash agents/training/validate.sh
          node agents/training/deploy-support.mjs release-env \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/agents/training/release.json" 2026.9.8 >/dev/null
          bash agents/training/tests/release.sh

      - name: Verify materialization-only write set and publish to selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            agents/training/release.json \
            agents/training/artifacts/openclaw-plugin-training-0.1.4.tgz \
            agents/training/artifacts/openclaw-plugin-training-0.1.4.sha256
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'agents/training/release.json',
                    'agents/training/artifacts/openclaw-plugin-training-0.1.4.tgz',
                    'agents/training/artifacts/openclaw-plugin-training-0.1.4.sha256'}
          if changed != expected:
              raise SystemExit(f'Unauthorized materialization write set: {changed}')
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Freeze Training 0.1.4 P0 safety release artifacts'
          git push origin HEAD:refs/heads/fix/training-p0-approval-load-guard
