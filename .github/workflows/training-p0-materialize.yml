name: Training P0 approved release materialization

on:
  push:
    branches: [fix/training-p0-approval-load-guard]
    paths: [.github/workflows/training-p0-materialize.yml]

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'dubrovin-m/openclaw-agents-src' && github.actor == 'dubrovin-m'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_SOURCE: af3bb627ef1fa8a870dba40b86afd0611986cca4
      PREVIOUS_RELEASE: 31216d99dd23cb36a3ad353a30575604aea525b4
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_update_notifier: "false"
    steps:
      - name: Check out this exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify owner-approved exact source and frozen baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/training-p0-approval-load-guard'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$APPROVED_SOURCE" = "$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$PREVIOUS_RELEASE" "$APPROVED_SOURCE"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('agents/training')
          pkg=json.loads((root/'plugin/package.json').read_text())
          lock=json.loads((root/'plugin/package-lock.json').read_text())
          manifest=json.loads((root/'plugin/openclaw.plugin.json').read_text())
          release=json.loads((root/'release.json').read_text())
          if [pkg.get('version'),lock.get('version'),lock['packages'][''].get('version'),manifest.get('version')] != ['0.1.7']*4:
              raise SystemExit('Only approved Training plugin 0.1.7 may be materialized')
          if release['plugin']['version'] != '0.1.3' or release['predecessor']['plugin']['version'] != '0.1.2':
              raise SystemExit('Unexpected frozen release baseline')
          for suffix in ['tgz','sha256']:
              if (root/'artifacts'/f'openclaw-plugin-training-0.1.7.{suffix}').exists():
                  raise SystemExit('Training 0.1.7 artifact must not pre-exist')
          PY

      - name: Set up qualified Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Qualify exact source before materialization
        working-directory: agents/training/plugin
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run plugin:build
          npm run plugin:validate

      - name: Materialize immutable Training 0.1.7 target
        shell: bash
        run: |
          set -euo pipefail
          cd agents/training/plugin
          output=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          test "$output" = 'openclaw-plugin-training-0.1.7.tgz'
          cp "$RUNNER_TEMP/$output" ../artifacts/"$output"
          cd ../../..
          python3 - <<'PY'
          import copy,hashlib,json,os,pathlib
          root=pathlib.Path('agents/training')
          f=root/'release.json'
          release=json.loads(f.read_text(encoding='utf-8'))
          prior=copy.deepcopy(release['plugin'])
          previous_source=copy.deepcopy(release['source'])
          if prior['version']!='0.1.3' or release['predecessor']['plugin']['version']!='0.1.2':
              raise SystemExit('Unexpected frozen Training predecessor')
          previous=copy.deepcopy(release)
          previous['plugin']=prior
          release['predecessor']={
              'source_revision':os.environ['PREVIOUS_RELEASE'],
              'plugin':prior,
              'workspace_sha256':previous_source['workspace_sha256'],
              'plugin_manifest_sha256':previous_source['plugin_manifest_sha256'],
          }
          def hash_file(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          artifact=root/'artifacts/openclaw-plugin-training-0.1.7.tgz'
          if not artifact.is_file() or (root/'artifacts/openclaw-plugin-training-0.1.7.sha256').exists():
              raise SystemExit('Materialization target already exists')
          digest=hash_file(artifact)
          (root/'artifacts/openclaw-plugin-training-0.1.7.sha256').write_text(
              f'{digest}  {artifact.name}\n',encoding='utf-8')
          release['plugin'].update({
              'version':'0.1.7',
              'artifact':'artifacts/'+artifact.name,
              'sha256':digest,
              'runtime_entry_sha256':hash_file(root/'plugin/dist/plugin.js'),
          })
          src=release['source']
          src['source_revision']=os.environ['APPROVED_SOURCE']
          src['workspace_sha256']={
              name:hash_file(root/'workspace'/name)
              for name in ['AGENTS.md','HEARTBEAT.md','IDENTITY.md','SOUL.md','USER.md']
          }
          src['tools_sha256']=hash_file(root/'config/training-tools.json')
          src['agent_fragment_sha256']=hash_file(root/'config/training-agent.fragment.json')
          src['plugin_manifest_sha256']=hash_file(root/'plugin/openclaw.plugin.json')
          f.write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          bash agents/training/validate.sh
          node agents/training/deploy-support.mjs release-env \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/agents/training/release.json" 2026.9.8 >/dev/null
          bash agents/training/tests/release.sh

      - name: Verify materialization-only write set and publish to selected branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            agents/training/release.json \
            agents/training/artifacts/openclaw-plugin-training-0.1.7.tgz \
            agents/training/artifacts/openclaw-plugin-training-0.1.7.sha256
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'agents/training/release.json',
                    'agents/training/artifacts/openclaw-plugin-training-0.1.7.tgz',
                    'agents/training/artifacts/openclaw-plugin-training-0.1.7.sha256'}
          if changed != expected:
              raise SystemExit(f'Unauthorized materialization write set: {changed}')
          PY
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Freeze Training 0.1.7 P0 safety release artifacts'
          git push origin HEAD:refs/heads/fix/training-p0-approval-load-guard
